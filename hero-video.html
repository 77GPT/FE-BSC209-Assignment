<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 text-gray-800">
<nav class="bg-blue-700 p-4 text-center text-white">
    <a class="underline" href="/FE-BSC209-Assignment/">Back to Home</a>
</nav>
<main class="mx-auto max-w-5xl p-6">
    <section class="rounded-xl bg-white p-8 text-center shadow">
        <p class="mb-3 uppercase tracking-wide">Welcome to my website</p>
        <h1 class="mb-4 text-4xl font-bold">Build Your Future with Technology</h1>
        <p class="mb-6">Discover web development, creativity and innovation.</p>
        <video controls preload="metadata" class="w-full rounded-lg">
            <source src="videos/your-video-file.mp4" type="video/mp4">
            Your browser does not support HTML video.
        </video>
        <p class="mt-6">
            <a class="text-blue-700 underline" href="/FE-BSC209-Assignment/">Back to Home</a>
        </p>
    </section>
</main>
</body>
</html>
