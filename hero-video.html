<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Video</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <nav class="bg-blue-700 p-4 text-center">
        <a href="/FE-BSC209-Assignment/" class="text-white underline">Back to Home</a>
    </nav>

    <main class="mx-auto max-w-5xl p-6">
        <section class="rounded-lg bg-white p-8 text-center shadow">
            <p class="mb-3 font-semibold">WELCOME TO MY WEBSITE</p>
            <h1 class="mb-4 text-4xl font-bold">Build Your Future with Technology</h1>
            <p class="mb-6 text-lg">Discover web development, creativity and innovation.</p>

            <video controls class="w-full rounded-lg">
                <source src="videos/YOUR-VIDEO-FILENAME.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>

            <div class="mt-6">
                <a href="/FE-BSC209-Assignment/" class="text-blue-700 underline">Explore My Assignment</a>
            </div>
        </section>
    </main>
</body>
</html>
