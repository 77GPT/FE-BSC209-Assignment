<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gray-100">
    <nav class="bg-blue-700 p-4 text-center">
        <a href="/FE-BSC209-Assignment/" class="text-white underline">Back to Home</a>
    </nav>

    <main class="mx-auto max-w-5xl p-6">

            <img
                src="images/YOUR-IMAGE-FILENAME.jpg"

            <div class="mt-6 text-center">
                <a href="/FE-BSC209-Assignment/" class="rounded bg-blue-700 px-6 py-3 text-white underline">Explore My Assignment</a>
            </div>

</html>
